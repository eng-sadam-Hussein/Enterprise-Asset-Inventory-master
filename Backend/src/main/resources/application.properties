spring.application.name=nexora-assetops-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5544/nexora_assetops}
spring.datasource.username=${DB_USER:nexora}
spring.datasource.password=${DB_PASSWORD:nexora_dev_2026}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

app.jwt.secret=${JWT_SECRET:NexoraAssetOpsJwtSecretKeyForDevelopmentOnly2026Secure!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080
